[package]
name = "isa198x-disasm"
description = "Spec-driven disassemblers for the 198x family CPUs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Depends only on `isa` (itself zero-dep) + std — the same neutral footing as
# `isa`, so a consumer like Emu198x gets disassembly without the assembler,
# parser, or CLI. See ../../decisions/why-not-llvm.md and the umbrella
# asm198x-and-shared-isa-spec.md.

[dependencies]
isa = { package = "isa198x", path = "../isa", version = "0.1.0" }

[lints]
workspace = true
